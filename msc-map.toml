# set.mm -> MSC 2020 mapping (hand-owned draft, 2026-11-19).
#
# [sections]: key = one or more set.mm header titles joined by " > ",
#   matched against consecutive ancestors of a definition's section.
#   For each definition the deepest matching header wins.
# [labels]: per-definition override (replaces the section codes).
# Concept cards in ../prove4mm/design-space/concepts (labels + msc) are applied
# as label overrides too; this file's [labels] win over them.
# Codes may be 2-, 3- or 5-character; names come from msc-codes.tsv.

